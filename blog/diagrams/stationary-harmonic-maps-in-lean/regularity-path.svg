<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1500" role="img" aria-labelledby="regularity-title regularity-desc">
  <title id="regularity-title">From stationarity to one regular representative</title>
  <desc id="regularity-desc">Domain stationarity gives exact monotonicity and all-center critical Morrey control. Compact target geometry and tangent weak harmonicity give the signed normal-projection antisymmetric system. These inputs construct a critical Coulomb frame, compensated Hodge estimates and envelope contraction, yielding a unique target-valued Hölder representative on the entire half ball. A smooth target permits a Poisson bootstrap of this same representative to smoothness.</desc>
  <defs>
    <pattern id="regularity-grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#c9dce9" stroke-opacity=".24"/></pattern>
    <marker id="regularity-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#407992" stroke-width="1.6" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #173b55; }
      .eyebrow { font-size: 20px; font-weight: 700; letter-spacing: 2px; fill: #3a718d; }
      .title { font-size: 32px; font-weight: 700; letter-spacing: -.5px; }
      .label { font-size: 24px; font-weight: 700; }
      .detail { font-size: 20px; fill: #496a7c; }
      .node { fill: #ffffff; stroke: #b9d2e0; stroke-width: 1.6; }
      .edge { fill: none; stroke: #407992; stroke-width: 2.2; marker-end: url(#regularity-arrow); stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1040" height="1500" rx="24" fill="#f7fbfd"/>
  <rect x="1" y="1" width="1038" height="1498" rx="23" fill="url(#regularity-grid)" stroke="#d8e6ee"/>
  <path d="M56 47H103" stroke="#237b88" stroke-width="4"/>
  <text x="120" y="54" class="eyebrow">01 / REGULARITY</text>
  <text x="56" y="105" class="title">From stationarity to regularity</text>
  <foreignObject x="56" y="116" width="820" height="44"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Arial,sans-serif;color:#496a7c;font-size:20px;display:flex;align-items:center;justify-content:flex-start;text-align:left;width:100%;height:100%;line-height:1.35;white-space:nowrap;">$n\geq2$ · compact embedded target · small normalized energy</div></foreignObject>
  <g fill="none" stroke="#91b7cc" stroke-opacity=".5"><circle cx="944" cy="87" r="24"/><circle cx="944" cy="87" r="38"/><path d="M893 87H995M944 36V138"/></g>

  <path class="edge" d="M271 284V320"/>
  <path class="edge" d="M769 284V320"/>
