  <title id="regularity-title">From stationarity to one regular representative</title>
  <desc id="regularity-desc">Domain stationarity gives exact monotonicity and all-center critical Morrey control. Compact target geometry and tangent weak harmonicity give the signed normal-projection antisymmetric system. These inputs construct a critical Coulomb frame, compensated Hodge estimates and envelope contraction, yielding a unique target-valued Hölder representative on the entire half ball. A smooth target permits a Poisson bootstrap of this same representative to smoothness.</desc>
