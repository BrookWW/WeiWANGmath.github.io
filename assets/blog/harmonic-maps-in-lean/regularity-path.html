  <title id="regularity-title">From small energy to one smooth representative</title>
  <desc id="regularity-desc">A mathematical dependency diagram for interior regularity of energy-minimizing harmonic maps. Target geometry and stationarity lead to one-step energy decay, then a Hölder representative. The weak equation also enters the same-map C1 gamma estimate. A separate Poisson Schauder estimate feeds the higher-order bootstrap. The conclusion uses one energy threshold and the same representative at every derivative order.</desc>
