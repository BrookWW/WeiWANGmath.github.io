name: Site content CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Build and validate site content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out submitted content
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-blog.txt

      - name: Set up Node.js for bundled KaTeX
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install build dependencies
        run: python3 -m pip install -r requirements-blog.txt

      - name: Build the static site and blog
        run: python3 scripts/build_site.py

      - name: Run content regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate generated content and local resources
        run: python3 scripts/check_site.py

      - name: Require committed generated files to match the build
        run: python3 scripts/check_generated.py
